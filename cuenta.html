
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi cuenta | e.l.f. Beauty</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<header class="encabezado">
    <a class="logo" href="index.html">e.l.f. <span>BEAUTY</span></a>
    <nav class="navegacion">
        <a href="index.html">Inicio</a>
        <a href="labios.html">Labios</a>
        <a href="rostro.html">Rostro</a>
        <a href="ojos.html">Ojos</a>
        <a href="carrito.html">Carrito</a>
        <a href="cuenta.html">Mi cuenta</a>
    </nav>
</header>

<main class="cuenta-contenedor">
    <h1>Mi cuenta</h1>

    <div class="botones-cuenta">
        <button id="boton-login" class="seleccionado"
                type="button" onclick="mostrarLogin()">
            Iniciar sesión
        </button>

        <button id="boton-registro" type="button"
                onclick="mostrarRegistro()">
            Crear cuenta
        </button>
    </div>

    <form id="form-login" class="formulario"
          action="login.php" method="post">

        <label for="correo-login">Correo electrónico</label>
        <input id="correo-login" type="email"
               name="correo" required>

        <label for="contrasena-login">Contraseña</label>
        <input id="contrasena-login" type="password"
               name="contrasena" required>

        <button class="boton" type="submit">
            Iniciar sesión
        </button>
    </form>

    <form id="form-registro" class="formulario"
          action="registro.php" method="post"
          style="display:none;">

        <label for="nombre">Nombre completo</label>
        <input id="nombre" type="text" name="nombre"
               maxlength="100" required>

        <label for="correo-registro">Correo electrónico</label>
        <input id="correo-registro" type="email"
               name="correo" maxlength="150" required>

        <label for="contrasena-registro">
            Contraseña (mínimo 8 caracteres)
        </label>
        <input id="contrasena-registro" type="password"
               name="contrasena" minlength="8" required>

        <button class="boton" type="submit">
            Crear cuenta
        </button>
    </form>
</main>

<footer>e.l.f. BEAUTY · Villa Diaz Sofia 0914 </footer>

<script>
function mostrarLogin() {
    document.getElementById("form-login").style.display = "block";
    document.getElementById("form-registro").style.display = "none";

    document.getElementById("boton-login").classList.add("seleccionado");
    document.getElementById("boton-registro").classList.remove("seleccionado");
}

function mostrarRegistro() {
    document.getElementById("form-login").style.display = "none";
    document.getElementById("form-registro").style.display = "block";

    document.getElementById("boton-registro").classList.add("seleccionado");
    document.getElementById("boton-login").classList.remove("seleccionado");
}
</script>

</body>
</html>
